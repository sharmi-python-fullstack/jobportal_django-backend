services:
  - type: web
    name: careerlane-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn job_portal.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerlane-db
          property: connectionString
      - key: ALLOW_EPHEMERAL_MEDIA
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: careerlane-frontend
    runtime: static
    buildCommand: cd job-portal-frontend && npm ci && npm run build
    staticPublishPath: job-portal-frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false

databases:
  - name: careerlane-db
    databaseName: careerlane
    user: careerlane
    plan: free
    region: oregon
